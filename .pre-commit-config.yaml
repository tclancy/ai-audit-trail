repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: denylist
        name: local denylist (never committed)
        entry: tools/denylist-check.sh
        language: script
        stages: [pre-commit, commit-msg]
        always_run: true
