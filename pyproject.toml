[project]
name = "ai-audit-trail"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
audittrail-log = { workspace = true }
audittrail-verify = { workspace = true }
audittrail-testkit = { workspace = true }

# The same pins requirements-dev.txt held, plus the workspace packages so that
# `uv sync` installs them editable. Everything is resolved into uv.lock.
[dependency-groups]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.1",
    "interrogate==1.7.0",
    "import-linter==2.1",
    "check-jsonschema==0.29.4",
    "pre-commit==4.5.1",
    "audittrail-log",
    "audittrail-verify",
    "audittrail-testkit",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D", "UP", "S", "BLE"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tools"]
pythonpath = ["tools"]
# importlib mode: test files with the same basename in two packages do not collide.
addopts = "--import-mode=importlib"

[tool.interrogate]
fail-under = 100
ignore-init-method = true

[tool.importlinter]
root_packages = ["audittrail", "audittrail_verify", "audittrail_testkit"]

[[tool.importlinter.contracts]]
name = "verifier imports nothing from the writer"
type = "forbidden"
source_modules = ["audittrail_verify"]
forbidden_modules = ["audittrail", "audittrail_testkit"]
