[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "audittrail-testkit"
version = "0.0.0"
description = "ai-audit-trail: testkit"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["locust>=2.31,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/audittrail_testkit"]
