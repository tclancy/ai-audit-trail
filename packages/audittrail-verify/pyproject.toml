[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "audittrail-verify"
version = "0.0.0"
description = "ai-audit-trail: verify"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["cryptography>=43,<44"]

[project.scripts]
audittrail-verify = "audittrail_verify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audittrail_verify"]
