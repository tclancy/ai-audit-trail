name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-types-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # The packages' declared dependencies must be present before mypy runs.
      - run: pip install -e packages/audittrail-verify -e packages/audittrail-log -e packages/audittrail-testkit
      # Same targets as `make check`, so CI and local runs cannot drift apart.
      - run: make lint
      - run: make types
      - run: make docs
      - run: lint-imports   # import-linter: audittrail_verify must not import audittrail

  schema-and-vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.29.4
      - name: manifest
        run: cd spec && sha256sum -c vectors.sha256
      - name: positive vectors validate line by line
        run: |
          set -euo pipefail
          n=0
          for f in $(find spec/vectors/positive -name '*.jsonl' | sort); do
            while IFS= read -r line; do
              printf '%s\n' "$line" > /tmp/rec.json
              check-jsonschema --schemafile spec/record.schema.json /tmp/rec.json
              n=$((n+1))
            done < "$f"
          done
          echo "validated $n positive records"
          test "$n" -gt 0
      - name: every negative vector has a line the schema rejects, or is not JSON at all
        run: |
          set -uo pipefail
          for d in $(find spec/vectors/negative -mindepth 1 -maxdepth 1 -type d | sort); do
            rejected=0
            for f in $(find "$d" -name '*.jsonl' | sort); do
              while IFS= read -r line || [ -n "$line" ]; do
                printf '%s\n' "$line" > /tmp/rec.json
                if ! check-jsonschema --schemafile spec/record.schema.json /tmp/rec.json >/dev/null 2>&1; then rejected=1; fi
              done < "$f"
            done
            # Byte-level negatives (BOM, CRLF, trailing space, unsorted keys, duplicate key, float, exponent, -0, non-ASCII, surrogate)
            # are still schema-valid JSON once parsed; only the round-trip check (SPEC §5 check 1) rejects them.
            check=$(sed -n 's/^check=\([0-9]*\) .*/\1/p' "$d/vector.expect")
            if [ "$rejected" -eq 0 ] && [ "$check" != "1" ] && [ "$check" != "4" ] && [ "$check" != "5" ] && [ "$check" != "9" ]; then
              echo "negative vector $(basename "$d") expects check $check but the schema accepted every line"; exit 1
            fi
          done
      # Schema-level rejection is necessary, not sufficient: checks 1 (round trip), 4 (chain), 5 (signature)
      # and 9 (reasons) are exercised by tools/vectors-go's tests now and by audittrail_verify's tests from M1.

  vectors-regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: regenerate and diff
        run: |
          cd tools/vectors-go && go run . --out ../../spec/vectors.regen
          diff -r ../../spec/vectors ../../spec/vectors.regen
      # Every negative vector fails at the check number in its vector.expect, and
      # every positive vector passes checks 1-5 and 9. The schema job above cannot
      # see checks 1, 4, 5 or 9; this is the step that proves the M0 done check.
      - run: make vectors-test

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip install -e packages/audittrail-verify -e packages/audittrail-log -e packages/audittrail-testkit
      - run: pytest -q --cov=audittrail --cov=audittrail_verify --cov-fail-under=90
      - name: grep tests (bypass tokens, key material, text channels)
        run: python tools/grep_tests.py

  verifier-isolated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build packages/audittrail-verify
      - name: install wheel into a clean venv and test against spec/ only
        run: |
          python -m venv /tmp/v && . /tmp/v/bin/activate
          pip install packages/audittrail-verify/dist/*.whl pytest
          pytest -q packages/audittrail-verify/tests
      - name: no audittrail import anywhere in the verifier
        run: |
          if grep -rnE '(from|import) audittrail(\.|\s|$)' packages/audittrail-verify/src; then
            echo "verifier imports the writer"; exit 1; fi

  mutations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip install -e packages/audittrail-verify -e packages/audittrail-log
      # Checks each diff applies (I15) and turns the suite red; passes with no diffs (M0).
      - run: make mutations

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
