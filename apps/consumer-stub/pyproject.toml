[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "consumer-stub"
version = "0.0.0"
description = "ai-audit-trail: consumer that acts only on a verified, bound, fresh, unseen receipt (M1)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["audittrail-log==0.0.0"]

[project.scripts]
consumer-stub = "consumer_stub:main"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer_stub"]
